{% extends "base.html" %}

{% block titre %}Publier un trajet, ISI Ride{% endblock %}

{% block contenu %}
{% set ville_choisie = saisie.get('ville') or ville_defaut %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-3">Publier un trajet</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Sens du trajet</label>
                <select name="sens" class="form-select" required>
                    <option value="aller" {% if saisie.get('sens') == 'aller' %}selected{% endif %}>Aller : vers l'ISI</option>
                    <option value="retour" {% if saisie.get('sens') == 'retour' %}selected{% endif %}>Retour : depuis l'ISI</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Ville</label>
                <select name="ville" class="form-select" required>
                    {% for ville in villes %}
                        <option value="{{ ville }}" {% if ville == ville_choisie %}selected{% endif %}>{{ ville }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Date et heure de départ</label>
                <input type="datetime-local" name="date_heure" class="form-control"
                       value="{{ saisie.get('date_heure', '') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre de places (de 1 à 4)</label>
                <input type="number" name="places" class="form-control" min="1" max="4"
                       value="{{ saisie.get('places', 3) }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Prix par personne (en dinars)</label>
                <input type="number" name="prix" class="form-control" min="0" step="0.5"
                       value="{{ saisie.get('prix', '') }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Point de rendez-vous (facultatif)</label>
                <input type="text" name="point_rdv" class="form-control"
                       value="{{ saisie.get('point_rdv', '') }}">
            </div>
            <button type="submit" class="btn btn-primary w-100">Publier le trajet</button>
        </form>
    </div>
</div>
{% endblock %}
