{% extends "base.html" %}

{% block titre %}Inscription, ISI Ride{% endblock %}

{% block contenu %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-3">Créer un compte</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nom</label>
                <input type="text" name="nom" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Prénom</label>
                <input type="text" name="prenom" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail institutionnel</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe (8 caractères minimum)</label>
                <input type="password" name="mot_de_passe" class="form-control" minlength="8" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Ville de résidence</label>
                <select name="ville" class="form-select" required>
                    <option value="">Choisir une ville</option>
                    {% for ville in villes %}
                        <option value="{{ ville }}">{{ ville }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Téléphone (facultatif)</label>
                <input type="text" name="telephone" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
        </form>
        <p class="mt-3 text-center">Déjà un compte ? <a href="{{ url_for('connexion') }}">Se connecter</a></p>
    </div>
</div>
{% endblock %}
